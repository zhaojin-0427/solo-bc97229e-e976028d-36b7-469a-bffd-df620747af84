worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream leakcheck_api {
        # The two API processes share one SQLite database on the shared
        # volume. Round-robin makes the multi-process consistency guarantees
        # observable during the demo.
        server api1:8000;
        server api2:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25m;

        location / {
            proxy_pass http://leakcheck_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
